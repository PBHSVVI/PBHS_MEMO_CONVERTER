name: Apply Phase 7.5 Conditional Scoring Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify exact v4.2 baseline
        run: python apply_phase7_5_conditional_v42.py --check

      - name: Apply conditional scoring + recovery fix
        run: python apply_phase7_5_conditional_v42.py

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"

      - name: Run engine tests
        run: python -m pytest -q engine/tests

      - name: Check review page JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/phase7-5-review/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script type="module">(.*?)</script>', html, flags=re.S)
          if len(blocks) != 1:
              raise SystemExit(f"Expected one module script, found {len(blocks)}")
          Path("/tmp/review-v42.mjs").write_text(blocks[0], encoding="utf-8")
          PY
          node --check /tmp/review-v42.mjs

      - name: Check diff
        run: git diff --check

      - name: Commit and push implementation
        run: |
          git config user.name "PBHS Memo Converter"
          git config user.email "actions@users.noreply.github.com"
          git add             engine/src/memo_engine/phase7_5.py             engine/src/memo_engine/canonical.py             engine/tests/test_phase7_5_raw_categories.py             docs/phase7-5-review/index.html
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Support conditional teacher marking corrections"
          git push origin HEAD:main
