name: Apply Phase 7.5 Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify exact patch baseline
        run: python apply_phase7_5_patch.py --check

      - name: Apply bounded Phase 7.5 patch
        run: python apply_phase7_5_patch.py

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"

      - name: Run engine tests
        run: python -m pytest -q engine/tests

      - name: Check diff
        run: git diff --check

      - name: Exclude workflow mutation from Actions commit
        run: |
          # GitHub's workflow GITHUB_TOKEN has contents:write but cannot itself
          # create/update another workflow file without the separate workflows
          # permission. Keep the tested process-memo.yml change for manual upload.
          git restore .github/workflows/process-memo.yml

      - name: Commit Phase 7.5 engine implementation
        run: |
          git config user.name "PBHS Memo Converter"
          git config user.email "actions@users.noreply.github.com"
          git add             engine/src/memo_engine/phase7_5.py             engine/src/memo_engine/corrections.py             engine/src/memo_engine/correction_reinterpretation.py             engine/src/memo_engine/cli.py             engine/tests/test_phase7_5_raw_categories.py
          if git diff --cached --quiet; then
            echo "No Phase 7.5 engine changes to commit."
            exit 0
          fi
          git commit -m "Implement Phase 7.5 RAW exception correction semantics"
          git push origin HEAD:main
