name: Phase 8.4B.4 Cloudflare Llama Activation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_ZERO_COST_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_COST_CONFIRMED }}
      MISTRAL_SCHOOL_PRIVATE_APPROVED: ${{ vars.MISTRAL_SCHOOL_PRIVATE_APPROVED }}
      CLOUDFLARE_WORKERS_AI_PLAN_MODE: free_only
      MEMO_VISION_REQUEST_TIMEOUT_SECONDS: "75"
      PHASE84B4_REPORT_PATH: /tmp/phase84b4-report.json

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record checked-out commit
        run: git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bounded activation dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"

      - name: Verify privacy and zero-cost gates without disclosure
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          test "$CLOUDFLARE_ZERO_COST_CONFIRMED" = "true"
          test "$MISTRAL_SCHOOL_PRIVATE_APPROVED" = "false"
          echo "Cloudflare credentials: configured"
          echo "Cloudflare zero-cost confirmation: true"
          echo "Mistral school-private approval: false"

      - name: Verify bounded Llama contract tests
        run: python -m pytest -q engine/tests/test_phase84b4_cloudflare_llama_contract.py

      - name: Run one-time terms acceptance and one-call synthetic activation
        run: python -m engine.src.memo_engine.phase84b4_cloudflare_llama_activation

      - name: Scan sanitized report
        if: always()
        shell: bash
        run: |
          ! grep -Eqi 'authorization|bearer|api[_-]?key|sb_secret_|service_role|signed[_-]?url|data:image' "$PHASE84B4_REPORT_PATH"
          python -m json.tool "$PHASE84B4_REPORT_PATH" >/dev/null

      - name: Upload sanitized activation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase84b4-cloudflare-llama-sanitized-report
          path: /tmp/phase84b4-report.json
          if-no-files-found: error
          retention-days: 14
