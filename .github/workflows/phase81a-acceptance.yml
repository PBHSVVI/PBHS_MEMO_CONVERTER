name: Phase 8.1A Read-Only Acceptance

on:
  workflow_dispatch:
    inputs:
      source_job_id:
        description: "Completed source job UUID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase81a-readonly-${{ inputs.source_job_id }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SOURCE_JOB_ID: ${{ inputs.source_job_id }}
      MEMO_PRIVACY_MODE: APPROVED_EXTERNAL_ONLY
      MEMO_APPROVED_PROVIDERS: groq
      MEMO_GROQ_FAST_MODEL: openai/gpt-oss-20b
      MEMO_GROQ_STRONG_MODEL: openai/gpt-oss-120b
      MEMO_AI_ESCALATE: "true"
      MEMO_AI_BATCH_SIZE: "6"
      MEMO_AI_MIN_INTERVAL_SECONDS: "20"
      MEMO_AI_MAX_RATE_RETRIES: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deterministic engine and hosted renderer
        run: |
          python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            pandoc \
            libreoffice-writer \
            libreoffice-math \
            poppler-utils \
            fonts-dejavu-core \
            fonts-noto-core \
            fonts-liberation2 \
            fonts-freefont-otf \
            fonts-stix

          fc-cache -f

      - name: Validate explicit source job input
        run: python engine/scripts/validate_job_id.py "$SOURCE_JOB_ID"

      - name: Run deterministic engine tests
        run: python -m pytest -q engine/tests

      - name: Run read-only Phase 8.1A hosted replay
        run: python -m engine.src.memo_engine.acceptance phase81a-replay "$SOURCE_JOB_ID"
