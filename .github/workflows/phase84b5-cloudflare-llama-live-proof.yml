name: Phase 8.4B.5 Cloudflare Llama Live Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_ZERO_COST_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_COST_CONFIRMED }}
      MISTRAL_SCHOOL_PRIVATE_APPROVED: ${{ vars.MISTRAL_SCHOOL_PRIVATE_APPROVED }}
      CLOUDFLARE_WORKERS_AI_PLAN_MODE: free_only
      MEMO_VISUAL_PROVIDER_RATE_RETRIES: "0"
      MEMO_VISUAL_PROVIDER_TRANSIENT_RETRIES: "0"
      MEMO_VISION_REQUEST_TIMEOUT_SECONDS: "75"
      PHASE84B5_REPORT_PATH: /tmp/phase84b5-report.json

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record checked-out commit
        run: git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bounded proof dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"

      - name: Verify privacy, cost, and one-call contract without disclosure
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          test "$CLOUDFLARE_ZERO_COST_CONFIRMED" = "true"
          test "$MISTRAL_SCHOOL_PRIVATE_APPROVED" = "false"
          test "$MEMO_VISUAL_PROVIDER_RATE_RETRIES" = "0"
          test "$MEMO_VISUAL_PROVIDER_TRANSIENT_RETRIES" = "0"
          ! grep -Fq 'accept_meta_terms' engine/src/memo_engine/phase84b5_cloudflare_llama_live_proof.py
          ! grep -Fq '"prompt": "agree"' engine/src/memo_engine/phase84b5_cloudflare_llama_live_proof.py
          echo "Cloudflare credentials: configured"
          echo "Cloudflare zero-cost confirmation: true"
          echo "Mistral school-private approval: false"
          echo "Agreement request path: absent"
          echo "Maximum live inference calls: one"

      - name: Verify bounded no-agreement proof tests
        run: python -m pytest -q engine/tests/test_phase84b5_cloudflare_llama_live_proof.py engine/tests/test_phase84b4_cloudflare_llama_contract.py

      - name: Run one-call synthetic structured-vision proof
        run: python -m engine.src.memo_engine.phase84b5_cloudflare_llama_live_proof

      - name: Scan sanitized report
        if: always()
        shell: bash
        run: |
          ! grep -Eqi 'authorization|bearer|api[_-]?key|sb_secret_|service_role|signed[_-]?url|data:image' "$PHASE84B5_REPORT_PATH"
          python -m json.tool "$PHASE84B5_REPORT_PATH" >/dev/null

      - name: Upload sanitized proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase84b5-cloudflare-llama-sanitized-report
          path: /tmp/phase84b5-report.json
          if-no-files-found: error
          retention-days: 14
