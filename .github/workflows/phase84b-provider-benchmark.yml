name: Phase 8.4B Free Provider Synthetic Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CLOUDFLARE_ZERO_COST_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_COST_CONFIRMED }}
      MISTRAL_ZERO_COST_CONFIRMED: ${{ vars.MISTRAL_ZERO_COST_CONFIRMED }}
      MISTRAL_SCHOOL_PRIVATE_APPROVED: "false"
      CLOUDFLARE_WORKERS_AI_PLAN_MODE: free_only
      MISTRAL_PLAN_MODE: free_only
      MEMO_APPROVED_PROVIDERS: groq,cloudflare,mistral
      MEMO_VISUAL_PROVIDER_ORDER: groq,cloudflare,mistral
      PHASE84B_REPORT_PATH: ${{ runner.temp }}/phase84b-report.json

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record checked-out commit
        run: git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt

      - name: Verify required configuration without disclosure
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          test -n "$MISTRAL_API_KEY"
          test "$CLOUDFLARE_ZERO_COST_CONFIRMED" = "true"
          test "$MISTRAL_ZERO_COST_CONFIRMED" = "true"
          test "$MISTRAL_SCHOOL_PRIVATE_APPROVED" = "false"
          echo "Cloudflare credentials: configured"
          echo "Mistral credential: configured"
          echo "Zero-cost confirmations: configured"
          echo "Mistral school-private approval: false"

      - name: Run bounded live synthetic benchmark
        run: python -m engine.src.memo_engine.phase84b_benchmark

      - name: Scan sanitized report
        shell: bash
        run: |
          ! grep -Eqi 'authorization|bearer|api[_-]?key|sb_secret_|service_role|signed[_-]?url|data:image' "$PHASE84B_REPORT_PATH"
          python -m json.tool "$PHASE84B_REPORT_PATH" >/dev/null

      - name: Upload sanitized benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: phase84b-sanitized-report
          path: ${{ runner.temp }}/phase84b-report.json
          if-no-files-found: error
          retention-days: 14
