name: Process Memo

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Memo Builder job UUID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: memo-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MEMO_JOB_ID: ${{ inputs.job_id }}
      MEMO_PRIVACY_MODE: APPROVED_EXTERNAL_ONLY
      MEMO_APPROVED_PROVIDERS: groq
      MEMO_GROQ_FAST_MODEL: openai/gpt-oss-20b
      MEMO_GROQ_STRONG_MODEL: openai/gpt-oss-120b
      MEMO_AI_ESCALATE: "true"
      MEMO_AI_BATCH_SIZE: "6"
      MEMO_AI_MIN_INTERVAL_SECONDS: "20"
      MEMO_AI_MAX_RATE_RETRIES: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deterministic worker and renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check -r engine/requirements.txt

          missing_packages=()

          if ! command -v tesseract >/dev/null 2>&1; then
            missing_packages+=(tesseract-ocr)
          fi

          if ! command -v pandoc >/dev/null 2>&1; then
            missing_packages+=(pandoc)
          fi

          if ! command -v libreoffice >/dev/null 2>&1 && ! command -v soffice >/dev/null 2>&1; then
            missing_packages+=(libreoffice-writer)
          fi

          if ! command -v pdffonts >/dev/null 2>&1; then
            missing_packages+=(poppler-utils)
          fi

          missing_packages+=(fonts-dejavu-core fonts-noto-core fonts-liberation2)

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${missing_packages[@]}"
          fc-cache -f

          echo "Hosted renderer toolchain:"
          tesseract --version | head -n 1
          pandoc --version | head -n 1
          (libreoffice --version || soffice --version) | head -n 1
          pdffonts -v 2>&1 | head -n 1

      - name: Validate workflow input
        run: python engine/scripts/validate_job_id.py "$MEMO_JOB_ID"

      - name: Run hosted memo worker
        run: python -m engine.src.memo_engine.cli run-job "$MEMO_JOB_ID"
