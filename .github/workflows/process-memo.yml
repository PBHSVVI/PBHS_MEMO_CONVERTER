name: Process Memo

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Memo Builder job UUID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: memo-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MEMO_JOB_ID: ${{ inputs.job_id }}
      MEMO_PRIVACY_MODE: APPROVED_EXTERNAL_ONLY
      MEMO_APPROVED_PROVIDERS: groq
      MEMO_GROQ_FAST_MODEL: openai/gpt-oss-20b
      MEMO_GROQ_STRONG_MODEL: openai/gpt-oss-120b
      MEMO_AI_ESCALATE: "true"
      MEMO_AI_BATCH_SIZE: "16"
      MEMO_AI_MIN_INTERVAL_SECONDS: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deterministic worker dependencies
        run: |
          python -m pip install --disable-pip-version-check -r engine/requirements.txt
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tesseract-ocr
          fi

      - name: Validate workflow input
        run: python engine/scripts/validate_job_id.py "$MEMO_JOB_ID"

      - name: Run hosted memo worker
        run: python -m engine.src.memo_engine.cli run-job "$MEMO_JOB_ID"
