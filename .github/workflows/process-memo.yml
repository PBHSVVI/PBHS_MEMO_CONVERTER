name: Process Memo

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Memo Builder job UUID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: memo-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      MEMO_CLOUDFLARE_VISION_MODEL: ${{ vars.MEMO_CLOUDFLARE_VISION_MODEL }}
      MEMO_CLOUDFLARE_STRUCTURER_MODEL: ${{ vars.MEMO_CLOUDFLARE_STRUCTURER_MODEL }}
      MEMO_CLOUDFLARE_COMPOSITE_VISUAL_ENABLED: ${{ vars.MEMO_CLOUDFLARE_COMPOSITE_VISUAL_ENABLED }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MEMO_MISTRAL_VISION_MODEL: ${{ vars.MEMO_MISTRAL_VISION_MODEL }}
      MISTRAL_SCHOOL_PRIVATE_APPROVED: ${{ vars.MISTRAL_SCHOOL_PRIVATE_APPROVED }}
      MEMO_JOB_ID: ${{ inputs.job_id }}
      MEMO_PRIVACY_MODE: APPROVED_EXTERNAL_ONLY
      MEMO_APPROVED_PROVIDERS: groq,cloudflare,mistral
      MEMO_VISUAL_PROVIDER_ORDER: groq,cloudflare,mistral
      GROQ_PLAN_MODE: free_only
      GROQ_ZERO_COST_CONFIRMED: "true"
      CLOUDFLARE_WORKERS_AI_PLAN_MODE: free_only
      CLOUDFLARE_ZERO_COST_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_COST_CONFIRMED }}
      MISTRAL_PLAN_MODE: free_only
      MISTRAL_ZERO_COST_CONFIRMED: ${{ vars.MISTRAL_ZERO_COST_CONFIRMED }}
      MEMO_GROQ_FAST_MODEL: openai/gpt-oss-20b
      MEMO_GROQ_STRONG_MODEL: openai/gpt-oss-120b
      MEMO_GROQ_VISION_MODEL: qwen/qwen3.8-27b
      MEMO_AI_ESCALATE: "true"
      MEMO_AI_BATCH_SIZE: "6"
      MEMO_AI_MIN_INTERVAL_SECONDS: "20"
      MEMO_AI_MAX_RATE_RETRIES: "5"
      MEMO_VISUAL_PHASE_TIMEOUT_SECONDS: "900"
      MEMO_GROQ_VISION_REQUEST_TIMEOUT_SECONDS: "45"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deterministic worker and renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            pandoc \
            libreoffice-writer \
            libreoffice-math \
            poppler-utils \
            fonts-dejavu-core \
            fonts-noto-core \
            fonts-liberation2 \
            fonts-freefont-otf \
            fonts-stix

          fc-cache -f

          echo "Hosted renderer toolchain:"
          tesseract --version | head -n 1
          pandoc --version | head -n 1
          (libreoffice --version || soffice --version) | head -n 1
          dpkg-query -W -f='${Status} ${Version}\n' libreoffice-math
          pdffonts -v 2>&1 | head -n 1
          fc-match "Cambria Math"
          fc-match "OpenSymbol"
          fc-match "STIX Math"

      - name: Validate workflow input
        run: python engine/scripts/validate_job_id.py "$MEMO_JOB_ID"

      - name: Run deterministic engine tests
        run: python -m pytest -q engine/tests

      - name: Validate production provider configuration
        run: python -m engine.src.memo_engine.cli validate-provider-config

      - name: Run hosted memo worker
        id: hosted_worker
        timeout-minutes: 38
        run: python -m engine.src.memo_engine.cli run-job "$MEMO_JOB_ID"

      - name: Recover interrupted hosted worker
        if: ${{ always() && steps.hosted_worker.outcome != 'success' }}
        run: python -m engine.src.memo_engine.cli finalize-interrupted-job "$MEMO_JOB_ID"
