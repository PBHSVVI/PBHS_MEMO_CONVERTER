name: Phase 8.4C Cloudflare Composite Activation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_ZERO_COST_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_COST_CONFIRMED }}
  MISTRAL_SCHOOL_PRIVATE_APPROVED: ${{ vars.MISTRAL_SCHOOL_PRIVATE_APPROVED }}
  CLOUDFLARE_WORKERS_AI_PLAN_MODE: free_only
  MEMO_VISUAL_PROVIDER_RATE_RETRIES: "0"
  MEMO_VISUAL_PROVIDER_TRANSIENT_RETRIES: "0"
  MEMO_VISION_REQUEST_TIMEOUT_SECONDS: "75"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bounded discovery dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"
      - name: Verify gates and no-agreement contract
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          test "$CLOUDFLARE_ZERO_COST_CONFIRMED" = "true"
          test "$MISTRAL_SCHOOL_PRIVATE_APPROVED" = "false"
          ! grep -Fq 'accept_meta_terms' engine/src/memo_engine/phase84c_cloudflare_composite_activation.py
          ! grep -Fq '"prompt": "agree"' engine/src/memo_engine/phase84c_cloudflare_composite_activation.py
      - name: Discover account-visible stage models without inference
        env:
          PHASE84C_DISCOVERY_ONLY: "true"
          PHASE84C_REPORT_PATH: /tmp/phase84c-discovery.json
        run: python -m engine.src.memo_engine.phase84c_cloudflare_composite_activation
      - name: Report selected models before inference
        shell: bash
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/phase84c-discovery.json', encoding='utf-8'))
          print('Stage-V model:', report['vision_model'])
          print('Stage-S model:', report['structurer_model'])
          print('Agreement calls:', report['agreement_calls'])
          print('Inference calls:', report['inference_calls'])
          PY
      - name: Upload sanitized discovery report
        uses: actions/upload-artifact@v4
        with:
          name: phase84c-cloudflare-discovery
          path: /tmp/phase84c-discovery.json
          retention-days: 14

  prove:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bounded proof dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"
      - name: Verify composite mocked suite
        run: python -m pytest -q engine/tests/test_phase84c_cloudflare_composite.py engine/tests/test_phase84c_activation.py
      - name: Run maximum two-call synthetic composite proof
        env:
          PHASE84C_REPORT_PATH: /tmp/phase84c-report.json
        run: python -m engine.src.memo_engine.phase84c_cloudflare_composite_activation
      - name: Scan sanitized report
        if: always()
        shell: bash
        run: |
          ! grep -Eqi 'authorization|bearer|api[_-]?key|sb_secret_|service_role|signed[_-]?url|data:image|STAGE-V TRANSCRIPT' /tmp/phase84c-report.json
          python -m json.tool /tmp/phase84c-report.json >/dev/null
      - name: Upload sanitized activation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase84c-cloudflare-composite-sanitized-report
          path: /tmp/phase84c-report.json
          if-no-files-found: error
          retention-days: 14
