name: Phase 8.4C Cloudflare Composite Activation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
  CLOUDFLARE_ZERO_COST_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_COST_CONFIRMED }}
  MISTRAL_SCHOOL_PRIVATE_APPROVED: ${{ vars.MISTRAL_SCHOOL_PRIVATE_APPROVED }}
  CLOUDFLARE_WORKERS_AI_PLAN_MODE: free_only
  MEMO_VISUAL_PROVIDER_RATE_RETRIES: "0"
  MEMO_VISUAL_PROVIDER_TRANSIENT_RETRIES: "0"
  MEMO_VISION_REQUEST_TIMEOUT_SECONDS: "75"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bounded discovery dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"
      - name: Verify gates and no-agreement contract
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          test "$CLOUDFLARE_ZERO_COST_CONFIRMED" = "true"
          test "$MISTRAL_SCHOOL_PRIVATE_APPROVED" = "false"
          ! grep -Fq 'accept_meta_terms' engine/src/memo_engine/phase84c_cloudflare_composite_activation.py
          ! grep -Fq '"prompt": "agree"' engine/src/memo_engine/phase84c_cloudflare_composite_activation.py
      - name: Discover account-visible stage models without inference
        env:
          PHASE84C_DISCOVERY_ONLY: "true"
          PHASE84C_REPORT_PATH: /tmp/phase84c-discovery.json
        run: python -m engine.src.memo_engine.phase84c_cloudflare_composite_activation
      - name: Report selected models before inference
        shell: bash
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/phase84c-discovery.json', encoding='utf-8'))
          print('Stage-V model:', report['vision_model'])
          print('Stage-S model:', report['structurer_model'])
          print('Agreement calls:', report['agreement_calls'])
          print('Inference calls:', report['inference_calls'])
          PY
      - name: Upload sanitized discovery report
        uses: actions/upload-artifact@v4
        with:
          name: phase84c-cloudflare-discovery
          path: /tmp/phase84c-discovery.json
          retention-days: 14

  stage_v:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bounded proof dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"
      - name: Verify composite mocked suite
        run: python -m pytest -q engine/tests/test_phase84c_cloudflare_composite.py engine/tests/test_phase84c_activation.py
      - name: Compute synthetic Stage-V identity without inference
        id: identity
        env:
          PHASE84C_MODE: identity
          PHASE84C_REPORT_PATH: /tmp/phase84c-identity.json
        shell: bash
        run: |
          python -m engine.src.memo_engine.phase84c_cloudflare_composite_activation
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('/tmp/phase84c-identity.json', encoding='utf-8') as source:
              print('cache_key=' + json.load(source)['cache_key'])
          PY
      - name: Restore exact synthetic Stage-V checkpoint
        id: restore-stage-v
        uses: actions/cache/restore@v4
        with:
          path: /tmp/phase84c-private-synthetic-stage-v.json
          key: phase84c-stage-v-${{ steps.identity.outputs.cache_key }}
      - name: Run or reuse bounded synthetic Stage-V proof
        env:
          PHASE84C_MODE: stage_v
          PHASE84C_STAGE_V_CHECKPOINT_PATH: /tmp/phase84c-private-synthetic-stage-v.json
          PHASE84C_REPORT_PATH: /tmp/phase84c-stage-v-report.json
        run: python -m engine.src.memo_engine.phase84c_cloudflare_composite_activation
      - name: Verify private checkpoint identity and synthetic-only guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          value = json.load(open('/tmp/phase84c-private-synthetic-stage-v.json', encoding='utf-8'))
          assert value['privacy_classification'] == 'synthetic_test'
          assert value['artifact_schema'] == 'phase8.4c-synthetic-stage-v-v1'
          assert value['stage_v']['status'] == 'success'
          assert value['stage_v']['transcript']
          PY
      - name: Save exact synthetic Stage-V checkpoint cache
        if: steps.restore-stage-v.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/phase84c-private-synthetic-stage-v.json
          key: phase84c-stage-v-${{ steps.identity.outputs.cache_key }}
      - name: Upload private synthetic Stage-V checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: phase84c-private-synthetic-stage-v
          path: /tmp/phase84c-private-synthetic-stage-v.json
          if-no-files-found: error
          retention-days: 14
      - name: Scan sanitized Stage-V report
        shell: bash
        run: |
          ! grep -Eqi 'authorization|bearer|api[_-]?key|sb_secret_|service_role|signed[_-]?url|data:image|STAGE-V TRANSCRIPT' /tmp/phase84c-stage-v-report.json
          python -m json.tool /tmp/phase84c-stage-v-report.json >/dev/null
      - name: Upload sanitized Stage-V report
        uses: actions/upload-artifact@v4
        with:
          name: phase84c-cloudflare-stage-v-sanitized-report
          path: /tmp/phase84c-stage-v-report.json
          retention-days: 14

  prove:
    needs: [discover, stage_v]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bounded proof dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"
      - name: Download exact synthetic Stage-V checkpoint
        uses: actions/download-artifact@v4
        with:
          name: phase84c-private-synthetic-stage-v
          path: /tmp/phase84c-private
      - name: Run maximum one-call synthetic Stage-S composite proof
        env:
          PHASE84C_STAGE_V_CHECKPOINT_PATH: /tmp/phase84c-private/phase84c-private-synthetic-stage-v.json
          PHASE84C_REPORT_PATH: /tmp/phase84c-report.json
        run: python -m engine.src.memo_engine.phase84c_cloudflare_composite_activation
      - name: Scan sanitized report
        if: always()
        shell: bash
        run: |
          ! grep -Eqi 'authorization|bearer|api[_-]?key|sb_secret_|service_role|signed[_-]?url|data:image|STAGE-V TRANSCRIPT' /tmp/phase84c-report.json
          python -m json.tool /tmp/phase84c-report.json >/dev/null
      - name: Upload sanitized activation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase84c-cloudflare-composite-sanitized-report
          path: /tmp/phase84c-report.json
          if-no-files-found: error
          retention-days: 14
