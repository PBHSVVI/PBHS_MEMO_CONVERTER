name: Phase 8 Quality Hosted Qualification

on:
  workflow_dispatch:
    inputs:
      check_provider_connectivity:
        description: Check the production provider model catalogues without inference
        type: boolean
        default: false
      openai_check:
        description: OpenAI verification mode (synthetic requires explicit credit approval)
        type: choice
        options: ['off', 'access', 'synthetic']
        default: 'off'
      reconcile_openai_ledger:
        description: Read the included-credit ledger and print only aggregate usage
        type: boolean
        default: false
      reference_trial:
        description: Run the bounded Phase 8.5E comparison on the isolated trial branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reference_trial:
    if: inputs.reference_trial && github.ref == 'refs/heads/codex/phase85e-reference-trial'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: pbhs-phase85e-reference-trial
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r engine/requirements.txt
      - name: Run the private question-local comparison without publishing a memo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEMO_OPENAI_ENABLED: ${{ vars.MEMO_OPENAI_ENABLED }}
          MEMO_OPENAI_INCLUDED_CREDIT_CONFIRMED: ${{ vars.MEMO_OPENAI_INCLUDED_CREDIT_CONFIRMED }}
          MEMO_OPENAI_SCHOOL_PRIVATE_APPROVED: ${{ vars.MEMO_OPENAI_SCHOOL_PRIVATE_APPROVED }}
          MEMO_OPENAI_ORGANIZATION: ${{ vars.MEMO_OPENAI_ORGANIZATION }}
          MEMO_OPENAI_PROJECT: ${{ vars.MEMO_OPENAI_PROJECT }}
          MEMO_PRIVACY_MODE: APPROVED_EXTERNAL_ONLY
        run: python -m engine.src.memo_engine.reference_trial

  ledger:
    if: inputs.reconcile_openai_ledger
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reconcile aggregate credit use from private PBHS Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m engine.src.memo_engine.openai_credit

  openai:
    if: inputs.openai_check == 'access' || inputs.openai_check == 'synthetic'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r engine/requirements.txt
      - name: Verify OpenAI access or perform bounded synthetic qualification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEMO_OPENAI_ORGANIZATION: ${{ vars.MEMO_OPENAI_ORGANIZATION }}
          MEMO_OPENAI_PROJECT: ${{ vars.MEMO_OPENAI_PROJECT }}
          MEMO_OPENAI_ENABLED: 'true'
          MEMO_OPENAI_INCLUDED_CREDIT_CONFIRMED: ${{ vars.MEMO_OPENAI_INCLUDED_CREDIT_CONFIRMED }}
          SUPABASE_URL: ${{ inputs.openai_check == 'synthetic' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SECRET_KEY: ${{ inputs.openai_check == 'synthetic' && secrets.SUPABASE_SECRET_KEY || '' }}
          OPENAI_CHECK_MODE: ${{ inputs.openai_check }}
        run: |
          if [ "$OPENAI_CHECK_MODE" = synthetic ]; then
            python -m engine.src.memo_engine.phase85_qualification --synthetic
          else
            python -m engine.src.memo_engine.phase85_qualification
          fi

  qualify:
    if: inputs.openai_check != 'synthetic' && !inputs.reconcile_openai_ledger && !inputs.reference_trial
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record checked-out commit
        run: git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deterministic engine and hosted renderer
        run: |
          python -m pip install --disable-pip-version-check -r engine/requirements.txt "pytest>=8,<9"

          # Avoid an unbounded stalled transfer from the runner's Azure mirror.
          sudo python3 - <<'PY'
          from pathlib import Path
          root = Path('/etc/apt/sources.list.d')
          for path in [Path('/etc/apt/sources.list'), *root.glob('*.sources'), *root.glob('*.list')]:
              if path.is_file():
                  original = path.read_text()
                  updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != original:
                      path.write_text(updated)
          PY
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends \
            tesseract-ocr \
            pandoc \
            libreoffice-writer \
            libreoffice-math \
            poppler-utils \
            fonts-dejavu-core \
            fonts-noto-core \
            fonts-liberation2 \
            fonts-freefont-otf \
            fonts-stix

          fc-cache -f
          (libreoffice --version || soffice --version) | head -n 1
          pandoc --version | head -n 1
          pdffonts -v 2>&1 | head -n 1

      - name: Qualify Slice 1 solution evidence
        run: python -m pytest -q engine/tests/test_phase8_solution_evidence.py

      - name: Qualify Phase 8.5A coordinate conversion and audited replay
        run: python -m pytest -q engine/tests/test_phase85a_coordinates.py engine/tests/test_phase85_openai.py

      - name: Qualify Phase 8.5B source-backed marking interpretation
        run: python -m pytest -q engine/tests/test_phase85b_marking.py engine/tests/test_phase85c_guideline.py

      - name: Qualify Slice 2 spatial DOCX and PDF preservation
        run: python -m pytest -q -s engine/tests/test_phase8_spatial_preservation.py

      - name: Qualify Slice 3 mathematical consistency
        run: python -m pytest -q engine/tests/test_phase8_mathematical_consistency.py

      - name: Qualify Slice 4 visual-provider resilience
        run: python -m pytest -q engine/tests/test_visual_processing_resilience.py

      - name: Qualify Phase 8.4A zero-cost provider fabric
        run: python -m pytest -q engine/tests/test_phase84a_provider_fabric.py

      - name: Qualify Phase 8.4B.4 Cloudflare Llama contract
        run: python -m pytest -q engine/tests/test_phase84b4_cloudflare_llama_contract.py

      - name: Qualify Phase 8.4C Cloudflare composite contract
        run: python -m pytest -q engine/tests/test_phase84c_grounding_coverage.py engine/tests/test_phase84c_cloudflare_composite.py engine/tests/test_phase84c_activation.py engine/tests/test_phase84c7_claim_boundary.py engine/tests/test_phase84c9_relation_preservation.py

      - name: Qualify full engine under the production provider configuration
        env:
          MEMO_CLOUDFLARE_VISION_MODEL: "@cf/google/gemma-4-26b-a4b-it"
          MEMO_CLOUDFLARE_STRUCTURER_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          MEMO_CLOUDFLARE_COMPOSITE_VISUAL_ENABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: "synthetic-hosted-preflight"
          CLOUDFLARE_AI_API_TOKEN: "synthetic-hosted-preflight"
          CLOUDFLARE_ZERO_COST_CONFIRMED: "true"
          CLOUDFLARE_WORKERS_AI_PLAN_MODE: "free_only"
          MEMO_APPROVED_PROVIDERS: "groq,cloudflare,mistral"
          MEMO_VISUAL_PROVIDER_ORDER: "groq,cloudflare,mistral"
          MEMO_VISUAL_PHASE_TIMEOUT_SECONDS: "900"
          MEMO_GROQ_VISION_REQUEST_TIMEOUT_SECONDS: "45"
          MEMO_CLOUDFLARE_REQUEST_TIMEOUT_SECONDS: "75"
          GROQ_API_KEY: "synthetic-hosted-preflight"
          GROQ_ZERO_COST_CONFIRMED: "true"
          GROQ_PLAN_MODE: "free_only"
          MEMO_PRIVACY_MODE: "APPROVED_EXTERNAL_ONLY"
          SUPABASE_URL: "https://supabase.invalid"
          SUPABASE_SECRET_KEY: "synthetic-hosted-preflight"
          MISTRAL_API_KEY: "synthetic-hosted-preflight"
          MISTRAL_PLAN_MODE: "free_only"
          MISTRAL_ZERO_COST_CONFIRMED: "true"
          MISTRAL_SCHOOL_PRIVATE_APPROVED: "false"
        run: |
          python -m pytest -q engine/tests
          python -m engine.src.memo_engine.cli validate-provider-config

      - name: Check production provider model catalogues without inference
        if: inputs.check_provider_connectivity
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_ZERO_COST_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_COST_CONFIRMED }}
          MISTRAL_SCHOOL_PRIVATE_APPROVED: ${{ vars.MISTRAL_SCHOOL_PRIVATE_APPROVED }}
          MEMO_CLOUDFLARE_VISION_MODEL: ${{ vars.MEMO_CLOUDFLARE_VISION_MODEL }}
          MEMO_CLOUDFLARE_STRUCTURER_MODEL: ${{ vars.MEMO_CLOUDFLARE_STRUCTURER_MODEL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          from engine.src.memo_engine.phase84b1_cloudflare_activation import (
              CloudflareDiagnosticError, list_account_models,
          )

          if (os.environ['CLOUDFLARE_ZERO_COST_CONFIRMED'] != 'true'
                  or os.environ['MISTRAL_SCHOOL_PRIVATE_APPROVED'] != 'false'):
              raise SystemExit('Required free-only and privacy gates are not set.')
          request = urllib.request.Request(
              'https://api.groq.com/openai/v1/models',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GROQ_API_KEY'],
                  'Accept': 'application/json',
                  'User-Agent': 'PBHS-Memo-Converter/phase5.1',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  groq_status = response.status
                  groq_models = {model['id'] for model in json.load(response)['data']}
          except urllib.error.HTTPError as exc:
              groq_status, groq_models = exc.code, set()
          except Exception as exc:
              raise SystemExit(f'Groq catalogue GET failed ({type(exc).__name__}).') from None
          try:
              cards, _, cloudflare_status = list_account_models(os.environ['CLOUDFLARE_ACCOUNT_ID'])
          except CloudflareDiagnosticError as exc:
              cloudflare_status, cards = exc.http_status, []
          except Exception as exc:
              raise SystemExit(f'Cloudflare catalogue GET failed ({type(exc).__name__}).') from None

          expected = {os.environ['MEMO_CLOUDFLARE_VISION_MODEL'], os.environ['MEMO_CLOUDFLARE_STRUCTURER_MODEL']}
          cloudflare_visible = expected <= {card['id'] for card in cards}
          groq_visible = 'qwen/qwen3.8-27b' in groq_models
          print(f'Groq catalogue HTTP {groq_status}. Configured vision model visible: {groq_visible}.')
          print(f'Cloudflare catalogue HTTP {cloudflare_status}. Both configured models visible: {cloudflare_visible}.')
          print('Inference calls: 0.')
          if not all((groq_status == 200, groq_visible, cloudflare_status == 200, cloudflare_visible)):
              raise SystemExit('Required provider models failed catalogue verification.')
          PY
